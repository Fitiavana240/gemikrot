
services:
  postgres:
    image: postgres:16-alpine
    container_name: wifitati-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wifitati
      # Lu depuis le `.env` de la racine (non versionné) : un mot de passe en
      # clair dans le dépôt reste un mot de passe exposé, même en local.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env — voir .env.example}
      POSTGRES_DB: wifitati
    ports:
      # 5432 est déjà pris par un Postgres natif sur cette machine — le
      # conteneur est exposé sur 55432 pour éviter le conflit.
      - "55432:5432"
    volumes:
      - wifitati_postgres_data:/var/lib/postgresql/data

volumes:
  wifitati_postgres_data: